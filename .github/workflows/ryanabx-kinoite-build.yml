name: Build ryanabx-kinoite Image

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'Containerfiles/ryanabx-kinoite.Containerfile'
      - 'Containerfiles/install_packages.sh'
      - '.github/workflows/ryanabx-kinoite-build.yml'
  schedule:
    - cron: "0 15 * * *" # 3pm UTC everyday (timed against official fedora container pushes)

env:
  IMAGE_REGISTRY: ghcr.io/${{ github.repository_owner }}

jobs:
  build:
    name: Build 
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
    steps:
      - name: Maximize build space
        uses: ublue-os/remove-unwanted-software@v7
        with:
          remove-android: 'true'
      
      # Checkout push-to-registry action GitHub repository
      - name: Checkout Push to Registry action
        uses: actions/checkout@v4

      - name: Configure buildah storage
        run: |
          mkdir -p ~/.config/containers
          printf '[storage]\ndriver="overlay"\n' > ~/.config/containers/storage.conf

      # Cache buildah layer storage and dnf metadata between runs.
      # Buildah's layer cache keys the first layer on the base image's digest,
      # so a republished base image still busts the cache correctly.
      - name: Cache buildah storage
        uses: actions/cache@v4
        with:
          path: |
            $HOME/.local/share/containers/storage
            $HOME/.cache/dnf
          key: buildah-kinoite-${{ hashFiles('Containerfiles/ryanabx-kinoite.Containerfile', 'Containerfiles/install_packages.sh') }}

      # Build metadata
      - name: Image Metadata
        uses: docker/metadata-action@v5
        id: meta
        with:
          images: |
            ryanabx-kinoite
          labels: |
            org.opencontainers.image.title=ryanabx-kinoite
            org.opencontainers.image.version=${{ matrix.version }}
            org.opencontainers.image.description=ryanabx-kinoite

      # Build image using Buildah action
      - name: Build Image
        id: build_image
        uses: redhat-actions/buildah-build@v2
        with:
          containerfiles: |
            Containerfiles/ryanabx-kinoite.Containerfile
          image: ryanabx-kinoite

      # Workaround bug where capital letters in your GitHub username make it impossible to push to GHCR.
      # https://github.com/macbre/push-to-ghcr/issues/12
      - name: Lowercase Registry
        id: registry_case
        uses: ASzc/change-string-case-action@v6
        with:
          string: ${{ env.IMAGE_REGISTRY }}
      
      - name: Push To GHCR
        uses: redhat-actions/push-to-registry@v2
        id: push
        if: github.event_name != 'pull_request'
        env:
          REGISTRY_USER: ${{ github.repository_owner }}
          REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        with:
          image: ${{ steps.build_image.outputs.image }}
          tags: ${{ steps.build_image.outputs.tags }}
          registry: ${{ steps.registry_case.outputs.lowercase }}
          username: ${{ env.REGISTRY_USER }}
          password: ${{ env.REGISTRY_PASSWORD }}
          extra-args: |
            --disable-content-trust

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
